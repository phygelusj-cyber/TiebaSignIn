name: Daily Tieba Sign-In

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: '调试用: 每账号只签前 N 个吧（留空 = 全量）'
        required: false
        default: ''
  schedule:
    - cron: '17 21 * * *'  # UTC 21:17 = 北京时间次日 05:17

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sign-in
        env:
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: python run.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
